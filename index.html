<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Novgorod 1995</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0c;
        color: #e8e4d8;
        font-family: 'Courier New', Courier, monospace;
      }

      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      #game-canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #1a1a22;
        box-shadow: 0 0 0 2px #3a3a48;
        max-width: 100vw;
        max-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" width="320" height="224" aria-label="Novgorod 1995 game canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
