<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Pin scale during play so double-tap / accidental pinch don't zoom the canvas.
      Accessibility: browsers that honor user zoom prefs may still allow page zoom
      via OS settings; in-game we rely on touch-action rather than user-scalable=no.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Novgorod 1995</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        position: fixed;
        inset: 0;
        background: #0a0a0c;
        color: #e8e4d8;
        font-family: 'Courier New', Courier, monospace;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }

      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* Letterbox / pillarbox fills the leftover viewport around the canvas. */
        background:
          radial-gradient(ellipse at center, #14141c 0%, #0a0a0c 70%);
        touch-action: none;
      }

      #game-canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        background: #1a1a22;
        box-shadow: 0 0 0 2px #3a3a48;
        /* Sized in JS to fit portrait + landscape; keep aspect 320×224. */
        max-width: 100vw;
        max-height: 100vh;
        max-width: 100dvw;
        max-height: 100dvh;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" width="320" height="224" aria-label="Novgorod 1995 game canvas"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
